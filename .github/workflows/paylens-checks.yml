name: PayLens checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: |
          python -m py_compile paylens-payment-analytics/dashboard/app.py
          python -m py_compile paylens-payment-analytics/src/generate_data.py
      - name: Run synthetic data integrity tests
        working-directory: paylens-payment-analytics
        run: python -m unittest discover -s tests -v
